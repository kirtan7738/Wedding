<!doctype html>
<html lang="gu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FX test (dev only)</title>
    <style>
      html, body { margin: 0; height: 100%; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .bar { position: fixed; bottom: 16px; left: 0; right: 0; display: flex; gap: 8px; justify-content: center; z-index: 5; }
      .bar button { min-height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid #b8934a; background: #fbf7ee; }
    </style>
  </head>
  <body>
    <canvas id="petals"></canvas>
    <canvas id="gold"></canvas>
    <div class="bar"><button id="b">Burst</button><button id="a">Ambient</button></div>
    <script type="module">
      import '../src/styles/base.css';
      import { createPetals2D } from '../src/fx/Petals2D.js';
      import { goldBurst2D } from '../src/fx/goldBurst2D.js';
      const css = getComputedStyle(document.documentElement);
      const palette = ['--marigold', '--marigold-deep', '--rose-light', '--rose-deep', '--kumkum'].map((v) => css.getPropertyValue(v).trim());
      const petals = createPetals2D(document.getElementById('petals'), { palette });
      let amb = false;
      window.__fire = () => { petals.burst(); goldBurst2D(document.getElementById('gold')); };
      document.getElementById('b').onclick = window.__fire;
      document.getElementById('a').onclick = () => petals.ambient((amb = !amb));
      if (location.search.includes('auto')) setTimeout(window.__fire, 300);
    </script>
  </body>
</html>
