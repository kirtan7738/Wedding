<!doctype html>
<html lang="gu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mockups — પ્રિન્સી ❀ પાર્થ</title>
    <link rel="stylesheet" href="./mockups.css" />
  </head>
  <body class="board">
    <!-- Shared SVG art: marigolds, leaves, bells, patterns, grain -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <radialGradient id="g-orange" cx="45%" cy="40%" r="65%">
          <stop offset="0" stop-color="#FFE29A" />
          <stop offset=".35" stop-color="#FFB21E" />
          <stop offset=".75" stop-color="#F27A0C" />
          <stop offset="1" stop-color="#C9520A" />
        </radialGradient>
        <radialGradient id="g-yellow" cx="45%" cy="40%" r="65%">
          <stop offset="0" stop-color="#FFF6B8" />
          <stop offset=".4" stop-color="#FFD84A" />
          <stop offset=".8" stop-color="#F6B40E" />
          <stop offset="1" stop-color="#D99206" />
        </radialGradient>
        <radialGradient id="g-red" cx="45%" cy="40%" r="65%">
          <stop offset="0" stop-color="#FF9C8A" />
          <stop offset=".45" stop-color="#E23B2E" />
          <stop offset="1" stop-color="#8F1414" />
        </radialGradient>
        <radialGradient id="g-white" cx="45%" cy="40%" r="65%">
          <stop offset="0" stop-color="#FFFFFF" />
          <stop offset=".6" stop-color="#FBF5E6" />
          <stop offset="1" stop-color="#E4D6B4" />
        </radialGradient>
        <linearGradient id="g-leaf" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7FB548" />
          <stop offset=".55" stop-color="#3E7D2B" />
          <stop offset="1" stop-color="#245A1E" />
        </linearGradient>
        <linearGradient id="g-brass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFF0B3" />
          <stop offset=".35" stop-color="#E2B54C" />
          <stop offset=".7" stop-color="#A9781F" />
          <stop offset="1" stop-color="#6E4B12" />
        </linearGradient>
        <linearGradient id="g-gold-text" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFF1BF" />
          <stop offset=".5" stop-color="#E2BC63" />
          <stop offset="1" stop-color="#A97C28" />
        </linearGradient>

        <!-- Marigold (genda): bumpy edge, layered ruffles, deep centre. Base colour from <use fill=…> -->
        <symbol id="genda" viewBox="-11 -11 22 22" overflow="visible">
          <g id="genda-edge"></g>
          <circle r="8.6" />
          <g id="genda-ruffle"></g>
          <circle r="2.3" fill="rgba(110,35,0,.32)" />
          <circle r="1.1" cx="-.6" cy="-.6" fill="rgba(255,255,255,.35)" />
        </symbol>
        <symbol id="leaf" viewBox="0 0 12 34" overflow="visible">
          <path d="M6 0 C11 7 11.5 22 6 34 C0.5 22 1 7 6 0Z" fill="url(#g-leaf)" />
          <path d="M6 2 L6 32" stroke="rgba(255,255,255,.35)" stroke-width=".7" fill="none" />
        </symbol>
        <radialGradient id="g-flame" cx="50%" cy="70%" r="60%">
          <stop offset="0" stop-color="#FFFBE0" />
          <stop offset=".35" stop-color="#FFD54A" />
          <stop offset=".75" stop-color="#FF8A1F" />
          <stop offset="1" stop-color="#E2510A" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="g-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#FFD27A" stop-opacity=".55" />
          <stop offset="1" stop-color="#FFB347" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="g-clay" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E9B867" />
          <stop offset=".5" stop-color="#B9772E" />
          <stop offset="1" stop-color="#7A4515" />
        </linearGradient>
        <symbol id="diya" viewBox="-30 -46 60 62" overflow="visible">
          <circle cy="-22" r="26" fill="url(#g-glow)" />
          <path class="flame" d="M0 -40 C7 -28 8 -18 0 -9 C-8 -18 -7 -28 0 -40Z" fill="url(#g-flame)" />
          <path d="M0 -26 C2.5 -21 2.6 -16 0 -12 C-2.6 -16 -2.5 -21 0 -26Z" fill="#FFFDF0" opacity=".9" />
          <path d="M-26 -8 Q0 -2 26 -8 Q22 10 0 12 Q-22 10 -26 -8Z" fill="url(#g-clay)" />
          <path d="M-26 -8 Q0 -2 26 -8" stroke="#F6D58E" stroke-width="1.2" fill="none" />
          <path d="M-14 3 Q0 7 14 3" stroke="#7A4515" stroke-width=".8" fill="none" stroke-dasharray="1.5 2" />
          <path d="M22 -9 Q31 -12 30 -16" stroke="url(#g-clay)" stroke-width="3" fill="none" stroke-linecap="round" />
        </symbol>
        <symbol id="bell" viewBox="-7 0 14 18" overflow="visible">
          <path d="M-1 0h2v2.2C4.2 3 5.3 7.2 5.3 11.2L6.6 13.6H-6.6L-5.3 11.2C-5.3 7.2-4.2 3-1 2.2Z" fill="url(#g-brass)" />
          <circle cy="15.4" r="1.6" fill="url(#g-brass)" />
        </symbol>

        <pattern id="damask" width="64" height="64" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="currentColor" stroke-width=".8">
            <circle cx="32" cy="32" r="10" />
            <path d="M32 14c6 6 6 30 0 36c-6-6-6-30 0-36z" />
            <path d="M14 32c6-6 30-6 36 0c-6 6-30 6-36 0z" />
            <circle cx="0" cy="0" r="6" /><circle cx="64" cy="0" r="6" /><circle cx="0" cy="64" r="6" /><circle cx="64" cy="64" r="6" />
            <path d="M0 32h6M58 32h6M32 0v6M32 58v6" />
          </g>
        </pattern>
        <pattern id="damask-gold" width="64" height="64" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="#a37a2c" stroke-width="1.1">
            <circle cx="32" cy="32" r="10" />
            <circle cx="32" cy="32" r="3" fill="#a37a2c" />
            <path d="M32 14c6 6 6 30 0 36c-6-6-6-30 0-36z" />
            <path d="M14 32c6-6 30-6 36 0c-6 6-30 6-36 0z" />
            <circle cx="0" cy="0" r="6" /><circle cx="64" cy="0" r="6" /><circle cx="0" cy="64" r="6" /><circle cx="64" cy="64" r="6" />
            <path d="M0 32h6M58 32h6M32 0v6M32 58v6" />
          </g>
        </pattern>
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch" />
          <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .55 0" />
        </filter>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28" />
        </filter>
      </defs>
    </svg>

    <header class="board-head">
      <p class="eyebrow latin">Princy ❀ Parth — cover options</p>
      <h1>કવર પસંદ કરો</h1>
      <p class="hint">Swipe sideways → A · B · C · D. Tell me the letter you like.</p>
    </header>

    <div class="phones" id="phones"></div>

    <section class="lettering-board">
      <p class="eyebrow latin">Name lettering — 5 styles</p>
      <h2>નામ — અક્ષર શૈલી</h2>
      <p class="hint">Swipe sideways → 1 · 2 · 3 · 4 · 5</p>
      <div class="letter-cards" id="letter-cards"></div>
    </section>

    <section class="body-board">
      <p class="eyebrow latin">Body text — 2 fonts</p>
      <div class="body-samples" id="body-samples"></div>
    </section>

    <template id="cover-tpl">
      <figure class="phone">
        <figcaption class="phone-label latin"></figcaption>
        <div class="cover">
          <svg class="cover-bg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <rect width="390" height="844" fill="url(#damask)" class="damask" />
            <rect width="390" height="844" filter="url(#grain)" class="grain" />
          </svg>
          <svg class="garland-side garland-left" viewBox="0 0 40 620" aria-hidden="true"></svg>
          <svg class="garland-side garland-right" viewBox="0 0 40 620" aria-hidden="true"></svg>
          <div class="envelope">
            <svg class="env-art" viewBox="0 0 330 470" aria-hidden="true">
              <rect x="1" y="1" width="328" height="468" rx="10" class="env-body" />
              <rect x="1" y="1" width="328" height="468" rx="10" fill="url(#damask)" class="env-damask" />
              <rect x="10" y="10" width="310" height="450" rx="6" class="env-line" />
              <path d="M2 4 L165 236 L328 4" class="env-flap" filter="url(#soft-shadow)" />
              <path d="M14 12 L165 222 L316 12" class="env-line" />
              <path d="M2 466 L130 300 M328 466 L200 300" class="env-line faint" />
            </svg>
            <p class="invocation">॥ શ્રી ગણેશાય નમઃ ॥</p>
            <div class="seal">
              <svg viewBox="-60 -60 120 120" aria-hidden="true"><path class="seal-edge" /><circle r="38" class="seal-ring" /><circle r="33" class="seal-ring thin" /></svg>
              <span class="seal-mono"></span>
            </div>
            <div class="env-text">
              <p class="cover-title">શુભ લગ્ન</p>
              <p class="cover-date">રવિવાર, ૧૩ ડિસેમ્બર ૨૦૨૬</p>
              <button class="cta" type="button"><span class="cta-gu">આમંત્રણ ખોલો</span><span class="cta-en latin">Tap to open</span></button>
            </div>
          </div>
          <svg class="diyas" viewBox="0 0 390 80" aria-hidden="true">
            <path d="M40 66 Q195 82 350 66" stroke="var(--line)" stroke-width=".8" fill="none" opacity=".6" />
            <use href="#diya" x="-30" y="-46" width="60" height="62" transform="translate(110 62) scale(.8)" />
            <use href="#diya" x="-30" y="-46" width="60" height="62" transform="translate(195 60) scale(1)" />
            <use href="#diya" x="-30" y="-46" width="60" height="62" transform="translate(280 62) scale(.8)" />
          </svg>
          <svg class="toran" viewBox="0 0 390 190" aria-hidden="true"></svg>
          <svg class="toran toran-bottom" viewBox="0 0 390 90" aria-hidden="true"></svg>
        </div>
      </figure>
    </template>

    <script type="module" src="./main.js"></script>
  </body>
</html>
